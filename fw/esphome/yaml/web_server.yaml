packages:
  - !include packages/common_ui.yaml


esphome:
  name: "ledds2"
  friendly_name: ${device_friendly_name}
  comment: "trailing edge dimmer"
  project:
    name: "VasilKalchev.LEDDs"
    version: "2.0"
  on_boot:
    - priority: 0
      then:
        - output.set_min_power:
            id: ${ac_dimmer_id}
            min_power: !lambda "return (float)id(minimum_power_input).state / 100.0f;"

        - lambda: |-
            id(${light_id}).set_default_transition_length( id(default_transition_length_input).state );

        - lambda: |-
            id(${light_id}).set_gamma_correct( id(gamma_correct_input).state );

        - lambda: |-
            std::string option = id(restore_mode_input).current_option();

            LightRestoreMode res_mode = LIGHT_ALWAYS_OFF;
            if (option == "Off") {
              res_mode = LIGHT_ALWAYS_OFF;
              id(${light_id}).turn_off().perform(); // redundant because light's restore_mode is set to ALWAYS_OFF
            } else if (option == "On") {
              res_mode = LIGHT_ALWAYS_ON;
              id(${light_id}).turn_on().perform();
            } else {
              id(${light_id}).turn_off().perform();
            }

web_server:
  port: 80
  version: 3

# =====

light:
  - id: !extend red_led
    web_server:
      sorting_weight: 5

  - id: !extend blue_led
    web_server:
      sorting_weight: 6

  - id: !extend white_led
    web_server:
      sorting_weight: 7


number:
  - id: !extend default_transition_length_input
    web_server:
      sorting_weight: -20

  - id: !extend minimum_power_input
    web_server:
      sorting_weight: -30

  - id: !extend gamma_correct_input
    web_server:
      sorting_weight: -40

  - id: !extend bulb_power_rating_input
    web_server:
      sorting_weight: -50


select:
  - id: !extend restore_mode_input
    web_server:
      sorting_weight: -10


button:
  - id: !extend restart_button
    web_server:
      sorting_weight: 10
